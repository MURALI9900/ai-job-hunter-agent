services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-job-hunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobhunter_local_only}
    ports:
      - "5432:5432"
    volumes:
      - jobhunter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jobhunter-postgres-data:
